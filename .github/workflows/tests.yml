name: Tests

# The image takes minutes to build and pulls the .NET SDK, the ODBC driver, sqlpackage and
# azcopy, so the tests run on their own rather than behind it. Nothing here talks to Fabric.

on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.11.16'
          - os: ubuntu-24.04
            python: '3.12.14'
          - os: windows-2025
            # Security-only 3.12 releases no longer ship Windows binaries.
            python: '3.12.10'
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      # pyodbc links against unixODBC and fails at import without it, which takes every test
      # module with it. Installed explicitly rather than relying on what the runner ships.
      - name: Install unixODBC
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends unixodbc

      - name: Install locked dependencies and build tools
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/bootstrap.txt
          python -m uv pip sync --system --require-hashes --only-binary=:all: requirements/bootstrap.txt requirements/build.txt requirements/dev.txt
          python -m uv pip install --system --no-build-isolation --no-deps -e .
          python -m uv pip check --system

      - name: Check lock and generated exports
        run: python scripts/lock_dependencies.py --check

      - name: Lint
        run: python -m ruff check .

      - name: Test
        # python -m, not bare pytest: two test modules import helpers from the tests package,
        # which only resolves when the repo root is on sys.path.
        run: python -m pytest -q
