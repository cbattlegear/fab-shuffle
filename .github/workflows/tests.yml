name: Container tests

on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    name: Linux production-runtime tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.37.0
          driver-opts: image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3

      - name: Build the production-derived test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: test
          platforms: linux/amd64
          load: true
          push: false
          tags: fab-shuffle:ci-test
          cache-from: |
            type=gha,scope=validation
            type=gha
          cache-to: type=gha,scope=validation,mode=max

      - name: Verify runtime, lock, lint and tests inside Docker
        run: docker run --rm --platform linux/amd64 --network none fab-shuffle:ci-test
