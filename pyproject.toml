[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fab-shuffle"
version = "2.0.0"
description = "Region transfer tool for Microsoft Fabric workspaces, driven by the Fabric REST API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "msal>=1.31",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
    "jinja2>=3.1",
    "azure-kusto-data>=4.6",
    "azure-cosmos>=4.9",
    "pyodbc>=5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
]

[tool.setuptools.packages.find]
include = ["fabshuffle*"]

[tool.setuptools.package-data]
fabshuffle = ["web/static/*", "web/templates/*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # FastAPI dependency injection relies on call expressions in argument defaults.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM117"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
